<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
</head>
<body>

<h1 th:text="${title}">회원정보</h1>

<!-- 완료 메시지 -->
<div th:if="${message}" th:text="${message}"></div>

<table border="1">
    <thead>
    <tr>
        <td>ID</td>
        <td>이름</td>
        <td>나이</td>
        <td>주소</td>
        <td>수정</td>
        <td>삭제</td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="member : ${lists}" th:object="${member}">
        <td th:text="*{id}"></td>
        <td th:text="*{name}"></td>
        <td th:text="*{age}"></td>
        <td th:text="*{addr}"></td>
        <td>
            <form th:action="@{/member/update}" method="get">
                <input type="hidden" name="updateId" th:value="*{id}">
                <input type="submit" value="수정">
            </form>
        </td>
        <td>
            <form th:action="@{/member/delete}" method="post">
                <input type="hidden" name="deleteId" th:value="*{id}">
                <input type="submit" value="삭제">
            </form>
        </td>
    </tr>
    </tbody>
</table>

<br>
<form th:action="@{/member/insertForm}" method="get">
    <input type="submit" value="신규회원입력">
</form>

</body>
</html>
