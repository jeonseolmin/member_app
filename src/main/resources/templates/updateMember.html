<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 수정</title>
</head>
<body>

<h1>회원 수정</h1>
<form th:action="@{/member/update}" method="post" th:object="${member}">
    <div>
        <label>ID : [[*{id}]]</label>
        <input type="hidden" th:field="*{id}">
    </div>
    <div>
        <label>이름</label>
        <input type="text" th:field="*{name}">
    </div>
    <div>
        <label>나이</label>
        <input type="number" th:field="*{age}" min="1" max="100">
    </div>
    <div>
        <label>주소</label>
        <input type="text" th:field="*{addr}">
    </div>
    <input type="submit" value="수정">
</form>

<a th:href="@{/member/view}">목록으로 돌아가기</a>

</body>
</html>
